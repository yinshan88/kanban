<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据看板 · 跳转中</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
      background:#0b0f1a;color:#e9effa;min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:20px}
    .box{text-align:center;max-width:380px}
    .dot{display:inline-block;width:34px;height:34px;border:3px solid rgba(255,255,255,.18);
      border-top-color:#ff2e63;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:18px}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:18px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
    p{font-size:13px;color:#8ba0c0;line-height:1.7;word-break:break-all}
    a{color:#ff6b8a}
    .st{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:20px;
      font-size:11px;background:rgba(255,46,99,.12);color:#ff8ba6}
    .st.ok{background:rgba(34,197,94,.12);color:#5dd99a}
  </style>
</head>
<body>
  <div class="box">
    <div class="dot" id="dot"></div>
    <h1 id="title">正在连接看板…</h1>
    <p id="tip">正在获取最新地址</p>
    <span class="st" id="st">检测中</span>
  </div>
  <script>
    (function(){
      var tip = document.getElementById('tip');
      var st = document.getElementById('st');
      var title = document.getElementById('title');
      var dot = document.getElementById('dot');
      var KEY = 'kanban_last_url';
      var cacheBust = function(){ return '?v=' + Date.now(); };

      // 预检目标地址是否可达（带超时；普通 fetch 跨域时 status/ok 仍可读）
      // 注意：跳转站是 HTTPS 页面，fetch http:// 地址会被 mixed content 拦截，自动升级试 https://
      // fetch 被 CORS 拦截时会 reject，用 <img> 探测兜底（img 不受 CORS 限制，onload=可达）
      function probeImg(u, timeout){
        return new Promise(function(resolve){
          var img = new Image();
          var done = false;
          var t = setTimeout(function(){ done = true; img.src = ''; resolve(false); }, timeout || 6000);
          img.onload = function(){ if(!done){ done = true; clearTimeout(t); resolve(true); } };
          img.onerror = function(){ if(!done){ done = true; clearTimeout(t); resolve(false); } };
          img.src = u;
        });
      }
      function probeOnce(u, timeout){
        return new Promise(function(resolve){
          var ctrl = new AbortController();
          var t = setTimeout(function(){ ctrl.abort(); }, timeout || 6000);
          fetch(u, { signal: ctrl.signal, cache: 'no-store' })
            .then(function(r){ clearTimeout(t); resolve(r.ok); })
            .catch(function(){ clearTimeout(t); probeImg(u, timeout).then(resolve); });
        });
      }
      function probe(url, timeout){
        if(url.indexOf('http://') === 0){
          return probeOnce(url, timeout).then(function(ok){
            if(ok) return true;
            return probeOnce('https://' + url.slice('http://'.length), timeout);
          });
        }
        return probeOnce(url, timeout);
      }

      // 读取 latest.txt（GitHub Pages，带时间戳防缓存）
      function fetchLatest(){
        return fetch('latest.txt' + cacheBust())
          .then(function(r){ if(!r.ok) throw new Error('no addr'); return r.text(); })
          .then(function(t){ return (t || '').trim(); });
      }

      // 从 localStorage 读上次成功地址
      function lastUrl(){
        try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; }
      }
      function saveUrl(u){
        try{ localStorage.setItem(KEY, u); }catch(e){}
      }

      // 尝试跳转到目标地址：先预检，可达才跳；不可达返回 false
      function tryGo(url){
        return probe(url).then(function(ok){
          if(ok){ saveUrl(url); st.className = 'st ok'; st.textContent = '地址可用，即将跳转'; return true; }
          return false;
        });
      }

      var tries = 0;
      var currentUrl = '';

      function loop(){
        fetchLatest().then(function(url){
          if(url && /^https?:\/\//.test(url)){
            if(url !== currentUrl){
              currentUrl = url;
              tip.textContent = '最新地址：' + url;
            }
            return tryGo(url).then(function(ok){
              if(ok){
                tip.textContent = '即将跳转 ' + url;
                setTimeout(function(){ location.replace(url); }, 300);
              } else {
                // 地址不可达：显示重试中，自动轮询（等地址更新或服务恢复）
                title.textContent = '正在等待看板服务恢复…';
                st.textContent = '地址暂不可达，自动重试中';
                tries++;
                setTimeout(loop, 3000);
              }
            });
          } else {
            throw new Error('bad addr');
          }
        }).catch(function(){
          // latest.txt 读取失败：用缓存地址兜底
          var cached = lastUrl();
          if(cached && cached !== currentUrl){
            currentUrl = cached;
            tip.textContent = '使用上次地址：' + cached;
            return tryGo(cached).then(function(ok){
              if(ok){
                tip.textContent = '即将跳转 ' + cached;
                setTimeout(function(){ location.replace(cached); }, 300);
              } else {
                tries++;
                setTimeout(loop, 3000);
              }
            });
          }
          tip.innerHTML = '地址获取失败，正在重试…<br><a href="javascript:location.reload()">点此立即重试</a>';
          st.textContent = '第 ' + (++tries) + ' 次重试';
          setTimeout(loop, 3000);
        });
      }

      loop();
    })();
  </script>
</body>
</html>
