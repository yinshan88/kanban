<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据看板 · 跳转中</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
      background:#0b0f1a;color:#e9effa;min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:20px}
    .box{text-align:center;max-width:360px}
    .dot{display:inline-block;width:34px;height:34px;border:3px solid rgba(255,255,255,.18);
      border-top-color:#ff2e63;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:18px}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:18px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
    p{font-size:13px;color:#8ba0c0;line-height:1.6}
    a{color:#ff6b8a}
  </style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h1>正在跳转到看板…</h1>
    <p id="tip">正在获取最新地址</p>
  </div>
  <script>
    (function(){
      var tip = document.getElementById('tip');
      fetch('latest.txt?v=' + Date.now())
        .then(function(r){ if(!r.ok) throw new Error('no addr'); return r.text(); })
        .then(function(url){
          url = (url || '').trim();
          if(url && /^https?:\/\//.test(url)){
            tip.textContent = '即将跳转 ' + url;
            setTimeout(function(){ location.replace(url); }, 250);
          } else {
            tip.innerHTML = '暂无可跳转地址';
          }
        })
        .catch(function(){
          tip.innerHTML = '跳转失败，请稍后重试<br><a href="javascript:location.reload()">点此重试</a>';
        });
    })();
  </script>
</body>
</html>
