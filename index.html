<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在进入看板…</title>
<link rel="preconnect" href="https://kb.aaaaaaa.vip" crossorigin>
<link rel="dns-prefetch" href="https://kb.aaaaaaa.vip">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
  canvas{display:block}
  #txt{position:fixed;left:0;right:0;bottom:9%;text-align:center;color:rgba(255,255,255,.55);
    font-size:13px;letter-spacing:4px;pointer-events:none;animation:p 1.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:.85}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="txt">正在进入看板</div>
<script>
(function(){
  // 黑白粒子网络：粒子漂浮，近距离连白线，靠近中心被轻微吸引。
  // 纯 canvas 无依赖；显示约 1.1s 后跳转看板，点击页面可立即跳。
  var GO='https://kb.aaaaaaa.vip';
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W,H,dots=[],N;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    N=Math.min(90,Math.round(W*H/16000));}
  size();addEventListener('resize',size);
  function mk(){return{x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,r:Math.random()*1.6+.6};}
  for(var i=0;i<N;i++)dots.push(mk());
  var t0=performance.now();
  function frame(now){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    var cx=W/2,cy=H/2,k=(now-t0)/1100;          // 0→1 渐入
    for(var i=0;i<dots.length;i++){
      var d=dots[i];
      d.x+=d.vx;d.y+=d.vy;
      d.x+=(cx-d.x)*.0006;d.y+=(cy-d.y)*.0006;   // 轻微向心
      if(d.x<0||d.x>W)d.vx*=-1;
      if(d.y<0||d.y>H)d.vy*=-1;
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);
      ctx.fillStyle='rgba(255,255,255,'+(.5*k)+')';ctx.fill();
      for(var j=i+1;j<dots.length;j++){
        var o=dots[j],dx=d.x-o.x,dy=d.y-o.y,d2=dx*dx+dy*dy;
        if(d2<130*130){
          ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(o.x,o.y);
          ctx.strokeStyle='rgba(255,255,255,'+((1-d2/16900)*.28*k)+')';
          ctx.lineWidth=1;ctx.stroke();
        }
      }
    }
    if(now-t0<1100)requestAnimationFrame(frame);
    else location.replace(GO);
  }
  requestAnimationFrame(frame);
  document.addEventListener('click',function(){location.replace(GO);});
})();
</script>
</body>
</html>
