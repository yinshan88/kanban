<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>正在进入看板…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="preconnect" href="https://kb.aaaaaaa.vip" crossorigin>
    <link rel="dns-prefetch" href="https://kb.aaaaaaa.vip">
    <!-- 展示形式：解码/乱码翻转显现（Text Scramble，经典开源效果模式，
         源自 Justin Windle / soulwire 的 CodePen "Text Scramble Effect"，
         各前端社区广泛流传的开源实现思路），配合纯 canvas 星尘漂浮背景。
         文字为 DOM 渲染 + vw 自适应字号，任何屏幕完整可见，无 3D、零重库、秒开。
         节奏：乱码翻滚约 1.2s 逐字定格 aaaaaaa.vip → 停留 0.9s → 跳转，点击立即跳。 -->
    <style>
        html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
            -webkit-tap-highlight-color:transparent}
        #stars{position:fixed;inset:0;z-index:1}
        #wrap{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
            align-items:center;justify-content:center;pointer-events:none}
        #addr{
            font-family:'Courier New',ui-monospace,monospace;
            font-weight:700;
            /* 手机单独适配：字号随屏宽缩放（vw），窄屏也不会被裁；
               min() 封顶防止桌面过大 */
            font-size:min(8.5vw,72px);
            color:#fff;
            letter-spacing:.06em;
            text-shadow:0 0 18px rgba(255,255,255,.55),0 0 60px rgba(255,255,255,.2);
            white-space:nowrap;
        }
        #addr .dim{color:rgba(255,255,255,.45)}   /* 未定格字符：暗灰 */
        #addr .lit{color:#fff}                    /* 已定格字符：亮白 */
        #bar{width:min(46vw,260px);height:2px;background:rgba(255,255,255,.12);
            margin-top:26px;border-radius:2px;overflow:hidden}
        #bar i{display:block;height:100%;width:0;background:#fff;
            box-shadow:0 0 10px rgba(255,255,255,.8);
            transition:width .18s linear}
        #go{position:fixed;left:0;right:0;bottom:calc(8% + env(safe-area-inset-bottom));
            text-align:center;z-index:3;color:rgba(255,255,255,.45);
            font:13px/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
            letter-spacing:4px;pointer-events:none;animation:p 1.8s ease-in-out infinite}
        @keyframes p{0%,100%{opacity:.3}50%{opacity:.85}}
    </style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="wrap">
    <div id="addr"></div>
    <div id="bar"><i id="fill"></i></div>
</div>
<div id="go">正在进入看板 · 点击立即跳转</div>

<script>
// ============ 星尘背景：漂浮微粒 + 缓慢流动（纯 Canvas 2D，无库） ============
(function(){
    var cv=document.getElementById('stars'),ctx=cv.getContext('2d');
    var DPR=Math.min(devicePixelRatio||1,2);
    var W,H,dots=[],N;
    function size(){
        W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
        cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
        N=Math.round(innerWidth*innerHeight/14000);   // 手机≈40~60 颗，桌面≈120
        dots=[];
        for(var i=0;i<N;i++)dots.push({
            x:Math.random()*W,y:Math.random()*H,
            vx:(Math.random()-.5)*.12*DPR,vy:(Math.random()-.5)*.12*DPR,
            r:(Math.random()*1.2+.4)*DPR,tw:Math.random()*Math.PI*2
        });
    }
    size();addEventListener('resize',size);
    (function loop(t){
        requestAnimationFrame(loop);
        ctx.clearRect(0,0,W,H);
        for(var i=0;i<dots.length;i++){
            var d=dots[i];
            d.x+=d.vx;d.y+=d.vy;
            if(d.x<0)d.x=W;if(d.x>W)d.x=0;
            if(d.y<0)d.y=H;if(d.y>H)d.y=0;
            var a=.25+.35*Math.abs(Math.sin(t*.001+d.tw));   // 闪烁
            ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);
            ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fill();
        }
    })(0);
})();

// ============ 解码显现（Text Scramble 经典模式：乱码逐字定格） ============
const TEXT = 'aaaaaaa.vip';
const GO = 'https://kb.aaaaaaa.vip';
const CHARS = '!<>-_\\/[]{}—=+*^?#01';

// 逐字独立状态机：每个字符经历随机次数的乱码翻转后定格（经典 TextScramble 逻辑）
function Scramble(el){
    this.el=el;
    this.frame=0;
    this.queue=[];
}
Scramble.prototype.setText=function(newText){
    const old=this.el.innerText||'';
    const len=Math.max(old.length,newText.length);
    this.queue=[];
    for(let i=0;i<len;i++){
        const from=old[i]||'',to=newText[i]||'';
        const start=Math.floor(Math.random()*18);        // 第几帧开始变
        const end=start+Math.floor(Math.random()*18);    // 第几帧定格
        this.queue.push({from,to,start,end,char:''});
    }
    cancelAnimationFrame(this.frameReq);
    this.frame=0;
    this.update();
};
Scramble.prototype.update=function(){
    let out='',done=0;
    for(const q of this.queue){
        if(this.frame>=q.end){done++;out+='<span class="lit">'+q.to+'</span>';}
        else if(this.frame>=q.start){
            if(!q.char||Math.random()<.28)
                q.char=CHARS[Math.floor(Math.random()*CHARS.length)];
            out+='<span class="dim">'+q.char+'</span>';
        }else out+='<span class="dim">'+(q.from||'&nbsp;')+'</span>';
    }
    this.el.innerHTML=out;
    if(done<this.queue.length){
        this.frameReq=requestAnimationFrame(()=>this.update());
        this.frame++;
    }
};

// ============ 进度条 + 节奏编排 ============
const addr=document.getElementById('addr'),fill=document.getElementById('fill');
const sc=new Scramble(addr);
setTimeout(()=>sc.setText(TEXT),250);                    // 0.25s 后开始解码
const t0=Date.now();
(function tick(){                                        // 进度条：2.4s 走满
    const k=Math.min((Date.now()-t0)/2400,1);
    fill.style.width=(k*100)+'%';
    if(k<1)requestAnimationFrame(tick);
})();
setTimeout(()=>location.replace(GO),2600);               // 解码完停 1s 内跳
document.addEventListener('touchstart',()=>location.replace(GO),{passive:true});
document.addEventListener('click',()=>location.replace(GO));
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://kb.aaaaaaa.vip"></noscript>
</body>
</html>
