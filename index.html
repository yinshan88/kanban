<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>正在进入看板…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="preconnect" href="https://kb.aaaaaaa.vip" crossorigin>
    <link rel="dns-prefetch" href="https://kb.aaaaaaa.vip">
    <!-- 展示形式：浅色渐变背景 + 双色粒子炸开动效 + 文字解码乱码翻转显现（Text Scramble）。
         文字 DOM 渲染 + vw 自适应字号，任何屏幕完整可见。零依赖纯 Canvas 2D。
         2026-09-19 23:20 用户拍板：文字要有动效 → 恢复解码乱码翻转（浅灰乱码→深灰定格）。
         节奏：0ms 预热落地连接 → 0.06s 开解码 → 400ms 起跳，点击立即跳。 -->
    <style>
        html,body{margin:0;padding:0;height:100%;overflow:hidden;
            -webkit-tap-highlight-color:transparent;
            background:linear-gradient(135deg,#fafbfc 0%,#eef1f6 55%,#e3e9f2 100%)}
        #stars{position:fixed;inset:0;z-index:1}
        #wrap{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
            align-items:center;justify-content:center;pointer-events:none}
        #addr{
            font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
            font-weight:900;
            font-size:min(8.5vw,72px);
            color:#1f2937;
            letter-spacing:.04em;
            white-space:nowrap;
        }
        #addr .dim{color:rgba(31,41,55,.28)}      /* 未定格字符：浅灰乱码 */
        #addr .lit{color:#1f2937}                 /* 已定格字符：深灰定格 */
        #go{position:fixed;left:0;right:0;bottom:calc(8% + env(safe-area-inset-bottom));
            text-align:center;z-index:3;color:rgba(31,41,55,.45);
            font:13px/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
            letter-spacing:4px;pointer-events:none;animation:p 1.8s ease-in-out infinite}
        @keyframes p{0%,100%{opacity:.3}50%{opacity:.85}}
    </style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="wrap">
    <div id="addr"></div>
</div>
<div id="go">正在进入看板 · 点击立即跳转</div>

<script>
// ============ 粒子背景：开屏从中心炸开 → 漂浮（纯 Canvas 2D，无库，浅色系双色粒子） ============
(function(){
    var cv=document.getElementById('stars'),ctx=cv.getContext('2d');
    var DPR=Math.min(devicePixelRatio||1,2);
    var W,H,dots=[];
    var COLORS=['94,114,235','52,168,255','255,158,88','94,190,170'];   // 靛蓝/天蓝/暖橙/青绿
    function size(){
        W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
        cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
        dots=[];
        var N=Math.round(innerWidth*innerHeight/9000);   // 手机≈80 颗，桌面≈200
        var cx=W/2,cy=H/2;
        for(var i=0;i<N;i++){
            // 开屏炸开：每粒子随机方向 + 随机初速（中心向外的爆发感）
            var ang=Math.random()*Math.PI*2;
            var spd=(Math.random()*3.2+.8)*DPR;
            dots.push({
                x:cx+(Math.random()-.5)*40*DPR,
                y:cy+(Math.random()-.5)*40*DPR,
                vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
                r:(Math.random()*1.8+.6)*DPR,
                tw:Math.random()*Math.PI*2,
                c:COLORS[Math.floor(Math.random()*COLORS.length)]
            });
        }
    }
    size();addEventListener('resize',size);
    (function loop(t){
        requestAnimationFrame(loop);
        ctx.clearRect(0,0,W,H);
        for(var i=0;i<dots.length;i++){
            var d=dots[i];
            // 炸开后速度指数衰减 → 缓慢漂浮
            d.vx*=.965;d.vy*=.965;
            d.vx+=Math.sin(t*.0006+d.tw)*.006*DPR;
            d.vy+=Math.cos(t*.0007+d.tw)*.006*DPR;
            d.x+=d.vx;d.y+=d.vy;
            if(d.x<0)d.x=W;if(d.x>W)d.x=0;
            if(d.y<0)d.y=H;if(d.y>H)d.y=0;
            var a=.45+.35*Math.abs(Math.sin(t*.001+d.tw));   // 闪烁
            ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);
            ctx.fillStyle='rgba('+d.c+','+a+')';ctx.fill();
        }
    })(0);
})();

// ============ 文字动效：解码乱码翻转显现（Text Scramble 经典模式） ============
const TEXT='aaaaaaa.vip';
const CHARS='!<>-_\\/[]{}—=+*^?#01';
function Scramble(el){this.el=el;this.frame=0;this.queue=[];}
Scramble.prototype.setText=function(newText){
    const len=newText.length;
    this.queue=[];
    for(let i=0;i<len;i++){
        const start=Math.floor(Math.random()*8);         // 第几帧开始变
        const end=start+4+Math.floor(Math.random()*8);   // 第几帧定格
        this.queue.push({to:newText[i],start,end,char:''});
    }
    cancelAnimationFrame(this.frameReq);
    this.frame=0;
    this.update();
};
Scramble.prototype.update=function(){
    let out='',done=0;
    for(const q of this.queue){
        if(this.frame>=q.end){done++;out+='<span class="lit">'+q.to+'</span>';}
        else if(this.frame>=q.start){
            if(!q.char||Math.random()<.28)
                q.char=CHARS[Math.floor(Math.random()*CHARS.length)];
            out+='<span class="dim">'+q.char+'</span>';
        }else out+='<span class="dim">&nbsp;</span>';
    }
    this.el.innerHTML=out;
    if(done<this.queue.length){
        this.frameReq=requestAnimationFrame(()=>this.update());
        this.frame++;
    }
};

// ============ 节奏编排（0ms 预热落地连接 + 400ms 起跳） ============
// 关键提速：落地 kb.aaaaaaa.vip 的 DNS+TCP+TLS 冷启动实测 ~2s（大头），
// 页面一打开就发 no-cors 预热请求把连接焐热，跳转时直接复用热连接，落地近乎秒开。
var GO='https://kb.aaaaaaa.vip';
try{fetch(GO+'/api/status',{mode:'no-cors',cache:'no-store'});}catch(e){}
var sc=new Scramble(document.getElementById('addr'));
setTimeout(function(){sc.setText(TEXT);},60);
setTimeout(function(){location.replace(GO);},400);
document.addEventListener('touchstart',function(){location.replace(GO);},{passive:true});
document.addEventListener('click',function(){location.replace(GO);});
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://kb.aaaaaaa.vip"></noscript>
</body>
</html>
